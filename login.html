<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Impulsa+</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1>Entrar no Impulsa+</h1>
      <form action="dashbord.html" method="get" class="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="seu@email.com" required>

        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" placeholder="********" required>

        <button type="submit">Entrar</button>
      </form>
      <p class="login-note">Ainda não tem conta? Fale com a equipe.</p>
    </div>
  </div>
</body>
</html>
